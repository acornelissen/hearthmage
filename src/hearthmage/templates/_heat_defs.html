{# The heat gradient the bars are filled with; include once per page, outside any polled partial. #}
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="heat-grad" x1="0" y1="0" x2="1" y2="0">
      <stop class="heat-stop-a" offset="0"/>
      <stop class="heat-stop-b" offset="0.6"/>
      <stop class="heat-stop-c" offset="1"/>
    </linearGradient>
  </defs>
</svg>
